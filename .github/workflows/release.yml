name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.9.0-rc.1
    with:
      app-name: ssh-client
      desktop-dir: cmd/ssh-client-desktop
      test-command: ""
      vet-command: ""
      build-command-windows: ./scripts/build.ps1
      build-command-linux: bash ./scripts/build.sh
      build-command-macos: bash ./scripts/build.sh
      linux-package-formats: raw,deb
      linux-package-description: "Cross-platform SSH desktop client"
      publish-release: true
